<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assurgent Team</title>
<meta name="description" content="Build income online. Build a business offline. Free onboarding and real guidance. Launching soon.">
<meta property="og:title" content="Assurgent Team">
<meta property="og:description" content="Build income online. Build a business offline. Launching soon.">
<meta name="theme-color" content="#0F2A44">
<style>
  :root{--navy:#0F2A44;--blue:#0A66D8;--orange:#F7931E;--amber:#FFC20E;--paper:#ffffff;--muted:#5b6b7c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px;text-align:center}
  main{max-width:520px}
  .mark{width:72px;height:72px;margin:0 auto 20px}
  h1{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.5px;line-height:1.1}
  h1 span{color:var(--blue)}
  .team{letter-spacing:.5em;font-size:13px;font-weight:700;margin:8px 0 28px;color:var(--navy)}
  p{font-size:17px;line-height:1.55;color:var(--muted)}
  .soon{display:inline-block;margin-top:28px;padding:6px 14px;border-radius:999px;background:#EAF2FD;color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .bar{height:4px;width:64px;margin:28px auto 0;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--orange))}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M18 88 L44 14 Q50 4 56 14 L72 58" fill="none" stroke="#0A66D8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 74 Q50 70 86 22" fill="none" stroke="#F7931E" stroke-width="8" stroke-linecap="round"/>
    <path d="M70 20 L90 16 L86 36" fill="none" stroke="#F7931E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1><span>Assurgent</span></h1>
  <div class="team">TEAM</div>
  <p>Build income online. Build a business offline.<br>Free onboarding and real guidance, for anyone ready to learn and take action.</p>
  <div class="soon">Launching soon</div>
  <div class="bar"></div>
</main>
</body>
</html>
